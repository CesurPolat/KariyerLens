<svg xmlns="http://www.w3.org/2000/svg" width="265" height="282" viewBox="0 0 265 282" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Arka plan -->
  <rect width="265" height="282" fill="#FDFCFE"/>

  <!-- K harfi -->
  <g>
    <!-- Sol dikey gövde -->
    <rect x="31" y="36.7" width="58" height="208.3" rx="12" fill="#7223CC"/>

    <!-- Üst kol (köşeler stroke-linejoin ile yuvarlatıldı) -->
    <polygon points="167.4,41.7 228.2,41.7 118,151.9 105,104.1"
             fill="#7523CF" stroke="#7523CF" stroke-width="10" stroke-linejoin="round"/>

    <!-- Alt bacak: açık renk şerit -->
    <polygon points="100,140 200,240 165.1,240 92,166.9"
             fill="#BE88F9" stroke="#BE88F9" stroke-width="10" stroke-linejoin="round"/>

    <!-- Alt bacak: koyu ana şerit -->
    <polygon points="100,137.9 130,135.1 235,240 202.1,240"
             fill="#5611BB" stroke="#5611BB" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- Büyüteç çevresindeki boşluk (arka plan renginde daire) -->
  <circle cx="120" cy="148" r="58" fill="#FDFCFE"/>

  <!-- Sap: halkayı bacağa bağlayan dar parça  -->
  <polygon points="150,184.5 160,174.5 172,186.5 162,196.5" fill="#5611BB"/>

  <!-- Büyüteç halkası -->
  <circle cx="120" cy="148" r="44.7" fill="#FEFEFE" stroke="#5A12BE" stroke-width="13.4"/>

  <!-- Kullanıcı ikonu -->
  <circle cx="120" cy="136.5" r="13" fill="#5C14BB"/>
  <path d="M100 168 C100 157 108 150 120 150 C132 150 140 157 140 168
           Q140 173.3 135 173.3 H105 Q100 173.3 100 168 Z" fill="#5C14BB"/>
</svg>
